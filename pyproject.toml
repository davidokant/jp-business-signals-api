[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jp-business-signals-api"
version = "0.2.0"
description = "Source-traceable Japanese business activity signals API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
jpbs-ingest = "jp_business_signals.ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jp_business_signals"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
