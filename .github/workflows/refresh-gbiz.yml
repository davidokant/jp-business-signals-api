name: Refresh production data

on:
  schedule:
    # 18:17 UTC is approximately 03:17 JST the following day.
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gbiz-refresh-production
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: "resourceful-recreation / production"
    timeout-minutes: 30
    env:
      APP_REFRESH_TOKEN: ${{ secrets.APP_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate the refresh credential
        shell: bash
        run: |
          test -n "$APP_REFRESH_TOKEN" || { echo "Missing APP_REFRESH_TOKEN" >&2; exit 1; }

      - name: Request the atomic production refresh
        # Railway can restart the worker after the atomic database replacement
        # even after the refresh has completed. Continue to the independent
        # tender-monitoring request and let the public status check verify
        # availability at the end of the run.
        continue-on-error: true
        run: >-
          curl --fail-with-body --silent --show-error --max-time 900
          --request POST
          --header "X-Refresh-Token: $APP_REFRESH_TOKEN"
          https://jp-business-signals-api-production.up.railway.app/internal/refresh-gbiz

      - name: Observe tender topics and detect changes
        run: >-
          curl --fail-with-body --silent --show-error --max-time 300
          --request POST
          --header "X-Refresh-Token: $APP_REFRESH_TOKEN"
          https://jp-business-signals-api-production.up.railway.app/internal/refresh-tenders

      - name: Verify the public data status
        shell: bash
        run: |
          for attempt in {1..12}; do
            if payload="$(curl --fail --silent --show-error --max-time 15 \
              https://jp-business-signals-api-production.up.railway.app/status)"; then
              echo "$payload"
              exit 0
            fi
            echo "Status endpoint not ready (attempt $attempt/12)"
            sleep 5
          done
          echo "Production status verification failed" >&2
          exit 1
